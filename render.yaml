# Render Blueprint for the FastAPI backend (the Next.js frontend is deployed on Vercel).
services:
  - type: web
    name: airbnb-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Only the deployed frontend may call the API from a browser.
      - key: CORS_ORIGINS
        value: https://scaler-airbnb-assignment.vercel.app
